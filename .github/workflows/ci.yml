name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  opencode-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Pinned to the version the plugin is verified against.
      - name: Install OpenCode v2.0.3
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --version 2.0.3 --no-modify-path
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - name: Plugin load + bootstrap injection
        run: node tests/opencode-smoke.mjs
