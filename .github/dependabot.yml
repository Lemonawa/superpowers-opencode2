# @opencode-ai/plugin must track the opencode2 server release (the `beta`
# tag), not semver-latest: snapshot tags sort higher than the real beta and
# break the build. Bump it manually alongside opencode2 upgrades.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "@opencode-ai/plugin"
