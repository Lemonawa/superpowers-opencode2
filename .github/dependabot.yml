# @opencode/plugin tracks the OpenCode v2 server release (`latest`). Snapshot
# builds live under the `dev`/`beta` dist-tags as prereleases, so Dependabot
# only proposes stable 2.x bumps; CI typechecks and tests each one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
